server:
  servlet:
    context-path: /api/v1/docs
  port: 9006

spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: gamesDatabase

---
spring:
  config:
    activate:
      on-profile: test
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testrabbit;MODE=PostgreSQL
    username: sa
    password:
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

